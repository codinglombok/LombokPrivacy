[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombokprivacy"
version = "0.1.0"
description = "Local differential privacy and data-minimization helpers: seeded PCG32, randomized response, generalized randomized response, estimators, and IP, domain and email masking. Part of the Lombok Ecosystem."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lombokprivacy"]
